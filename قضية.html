<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>القضية 404</title>

<style>

:root {

  --navy:#2a4170;

  --lav:#7b78a4;

  --blue:#9fb4ff;

  --ink:#24324a;

}

* { box-sizing:border-box; }

body {

  margin:0;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:#f5f6fb;

  color:var(--ink);

  font-family:Arial,Tahoma,sans-serif;

  text-align:center;

}

.card {

  width:100%;

  max-width:600px;

  padding:28px 22px;

  background:white;

  border:2px solid var(--blue);

  border-radius:20px;

  box-shadow:0 8px 28px #24324a12;

}

h1 { color:var(--navy); margin:0 0 8px; }

.sub { color:var(--lav); margin:0 0 24px; }

.fields {

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin:22px 0;

}

label {

  display:block;

  font-weight:bold;

  margin-bottom:7px;

}

select {

  width:100%;

  padding:13px;

  border:1px solid #bbc5df;

  border-radius:10px;

  background:white;

  font-size:20px;

  color:var(--ink);

}

button {

  width:100%;

  padding:14px;

  border:0;

  border-radius:12px;

  background:var(--navy);

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

.result {

  display:none;

  padding:30px 20px;

}

.result h1 { font-size:30px; }

.result p { font-size:18px; line-height:1.9; }

.success { color:#205b3b; }

.error { color:#8a3f2b; }

.secondary {

  margin-top:15px;

  background:var(--lav);

}

@media(max-width:480px) {

  .fields { grid-template-columns:1fr; }

  .card { padding:22px 16px; }

}

</style>

</head>

<body>

<main class="card">

<section id="entry">

  <h1>القضية 404</h1>

  <p class="sub">مدقّق الحل | غرفة التحقيق الرقمي</p>

  <p>أدخلن رمز كل ظرف بالترتيب للوصول إلى نهاية القضية.</p>

  <div class="fields">

    <div>

      <label for="a">رمز الظرف الأول</label>

      <select id="a">

        <option value="">اختاري الرمز</option>

        <option value="△">△</option>

        <option value="★">★</option>

        <option value="○">○</option>

      </select>

    </div>

    <div>

      <label for="b">رمز الظرف الثاني</label>

      <select id="b">

        <option value="">اختاري الرمز</option>

        <option value="١">١</option>

        <option value="٢">٢</option>

        <option value="٧">٧</option>

      </select>

    </div>

    <div>

      <label for="c">رمز الظرف الثالث</label>

      <select id="c">

        <option value="">اختاري الرمز</option>

        <option value="✖">✖</option>

        <option value="◆">◆</option>

        <option value="☾">☾</option>

      </select>

    </div>

    <div>

      <label for="d">رمز الظرف الرابع</label>

      <select id="d">

        <option value="">اختاري الرمز</option>

        <option value="♣">♣</option>

        <option value="♠">♠</option>

        <option value="♥">♥</option>

      </select>

    </div>

  </div>

  <button type="button" onclick="checkCase()">تحقّقن من الحل</button>

</section>

<section id="success" class="result">

  <h1 class="success">تم حل القضية بنجاح!</h1>

  <p>أحسنتن يا فريق التحقيق الرقمي.</p>

  <p>لقد اجتزتن جميع مراحل القضية.</p>

  <button class="secondary" type="button" onclick="retry()">

    العودة للصفحة الرئيسية

  </button>

</section>

<section id="error" class="result">

  <h1 class="error">هناك خطأ!</h1>

  <p>الرموز المدخلة غير صحيحة، ولم تُحل القضية بعد.</p>

  <p>راجعن الأدلة في الأظرف وحاولن مرة أخرى.</p>

  <button class="secondary" type="button" onclick="retry()">

    العودة للصفحة الرئيسية

  </button>

</section>

</main>

<script>

function showScreen(screen) {

  document.getElementById('entry').style.display = 'none';

  document.getElementById('success').style.display = 'none';

  document.getElementById('error').style.display = 'none';

  screen.style.display = 'block';

}

function checkCase() {

  const values = ['a','b','c','d'].map(

    id => document.getElementById(id).value

  );

  if (values.some(value => value === '')) {

    alert('أكملن اختيار الرموز الأربعة أولاً.');

    return;

  }

  if (values.join('') === '★٧◆♥') {

    showScreen(document.getElementById('success'));

  } else {

    showScreen(document.getElementById('error'));

  }

}

function retry() {

  ['a','b','c','d'].forEach(id => {

    document.getElementById(id).value = '';

  });

  showScreen(document.getElementById('entry'));

}

</script>

</body>

</html>
